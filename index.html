<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BMW X5 Racer - Per Antonella 💐</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ═══════════════════════════════════════════════════════════════
     START SCREEN
═══════════════════════════════════════════════════════════════ -->
<div id="start-screen">
  <div id="start-box">

    <!-- Festive header -->
    <div class="festa-header">
      🌸 Antonella! 🌸<br>
      <span class="festa-sub">Buona Festa della Mamma!!</span>
    </div>

    <h1 class="title">🏎 BMW X5 RACER 🏎</h1>

    <!-- 8-bit ceramic dish art -->
    <div class="dish-art-wrap">
      <canvas id="dishArt" width="300" height="148"></canvas>
    </div>

    <!-- Story / instructions -->
    <p class="instructions">
      Guida la BMW X5 di tuo marito<br>
      collezionando tutti i piatti,<br>
      ma fai attenzione alle isole pedonali!!
    </p>

    <!-- Record & volume -->
    <div class="start-meta">
      <span class="hs-label">🏆 RECORD: <span id="hs-display">0</span></span>
      <button id="btn-vol-start" class="btn-vol">♫ VOLUME ON</button>
    </div>

    <button id="btn-play" class="btn-play">▶ GIOCA!</button>

  </div>
</div>


<!-- ═══════════════════════════════════════════════════════════════
     GAME SCREEN
═══════════════════════════════════════════════════════════════ -->
<div id="game-wrapper" class="hidden">

  <h1 class="title">🏎 BMW X5 RACER 🏎</h1>

  <div id="hud">
    <span>PUNTI: <span id="score">0</span></span>
    <span id="status-display">PRONTI!</span>
    <span class="kmh-wrap"><span id="kmh-display">0</span> KM/H</span>
  </div>

  <canvas id="gameCanvas" width="360" height="540"></canvas>

  <div id="controls">
    <!-- Primary row: direction buttons + pause -->
    <div class="ctrl-row main-row">
      <button id="btn-left"  class="btn-dir" onclick="game.moveLeft()">◀ SINISTRA</button>
      <button id="btn-pause" class="btn-sec" onclick="game.togglePause()">⏸</button>
      <button id="btn-right" class="btn-dir" onclick="game.moveRight()">DESTRA ▶</button>
    </div>
    <!-- Secondary row -->
    <div class="ctrl-row">
      <button id="btn-music"    class="btn-sec" onclick="game.toggleMusic()">♫ MUSICA ON</button>
      <button                   class="btn-sec" onclick="game.reset()">↺ RESET</button>
      <button                   class="btn-home btn-sec" onclick="goHome()">🏠 HOME</button>
    </div>
  </div>

  <div id="keys-hint">
    ← / → corsie &nbsp;|&nbsp; P pausa &nbsp;|&nbsp; R reset &nbsp;|&nbsp; M musica
  </div>

</div>


<!-- ═══════════════════════════════════════════════════════════════
     GAME-OVER OVERLAY
═══════════════════════════════════════════════════════════════ -->
<div id="overlay" class="hidden">
  <div id="overlay-box">
    <div id="overlay-title"></div>
    <div id="overlay-score"></div>
    <div id="overlay-record"></div>
    <button class="btn-reset" onclick="game.reset()">↺ RICOMINCIA</button>
    <a href="https://club.aci.it/entra-nel-club/trova-servizio/soccorso-stradale/"
       target="_blank" rel="noopener noreferrer">
      <button class="btn-help">🆘 SERVE AIUTO?</button>
    </a>
    <button class="btn-home-over" onclick="goHome()">🏠 TORNA ALLA HOME</button>
  </div>
</div>


<script src="game.js"></script>
<script>
  const game = new Game('gameCanvas');

  // Populate start-screen high score
  document.getElementById('hs-display').textContent = game._getHighScore();

  // Draw dish pixel art
  (function () {
    const c = document.getElementById('dishArt');
    drawDishArt(c.getContext('2d'), c.width, c.height);
  })();

  // Volume toggle on start screen
  document.getElementById('btn-vol-start').addEventListener('click', function () {
    game._musicOn = game.audio.toggle();
    this.textContent = game.audio.enabled ? '♫ VOLUME ON' : '♪ VOLUME OFF';
  });

  // Play button
  document.getElementById('btn-play').addEventListener('click', function () {
    document.getElementById('start-screen').classList.add('hidden');
    document.getElementById('game-wrapper').classList.remove('hidden');
    game.init();
  });

  // Return to home from anywhere
  function goHome() {
    game.audio.stopEngine();
    game.audio.stopMusic();
    if (game._raf) cancelAnimationFrame(game._raf);
    game.gameOver = true;
    document.getElementById('overlay').classList.add('hidden');
    document.getElementById('game-wrapper').classList.add('hidden');
    document.getElementById('start-screen').classList.remove('hidden');
    document.getElementById('hs-display').textContent = game._getHighScore();
  }

  // Keyboard shortcuts
  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowLeft')          game.moveLeft();
    if (e.key === 'ArrowRight')         game.moveRight();
    if (e.key === 'p' || e.key === 'P') game.togglePause();
    if (e.key === 'r' || e.key === 'R') game.reset();
    if (e.key === 'm' || e.key === 'M') game.toggleMusic();
  });
</script>
</body>
</html>
